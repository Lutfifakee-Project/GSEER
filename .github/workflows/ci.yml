# GSEER CI (v0.2.0).
#
# AC-1.1: go build ./... under both 1.26.x and 1.27.x.
# AC-1.2: go vet ./... clean.
# AC-1.3: golangci-lint (v2 config) run clean.
# AC-1.4: govulncheck ./... clean.
# AC-3.1: import-graph test green (no collector/egress deps) — Search ≠ Scan.
# AC-5.1: no-phantom-commands test — every help-listed command is
#   registered and runnable (completed in M11; kept as a CI pin).
# AC-M3-15: migration audit — force-migrate is reachable ONLY from
#   `gseer db migrate force` and the storage admin primitive
#   (TestForceNotCallableFromOtherCommands).
# AC-M13:  privilege audit — suppression audit rows survive rule
#   removal (TestSuppressionAuditSurvivesRuleRemoval).
#
# Integration suites use build tag `integration` and run against real
# PostgreSQL 16 AND 17 (matrix). They CANNOT silently skip: the test
# helpers (adminConnect/testDB/cliTestDB/colTestDB) call t.Fatalf on any
# PG-reachability failure, so a missing GSEER_TEST_PG_ADMIN or a down
# service fails the build instead of reporting a pass with skipped
# suites. GSEER_TEST_REQUIRE=1 is set in CI as documentation of the
# fail-hard posture (the code is already unconditionally fatal).
#
# Least-privilege: permissions: contents: read. Actions pinned:
# checkout@v4, setup-go@v5, golangci/golangci-lint-action@v9.3.0,
# goreleaser/goreleaser-action@v2.9.1 (CLI pinned to v2.20.0).
# govulncheck pinned to v1.9.0 (built with Go 1.27.x).
#
# The release gate requires all of the above green on both Go majors
# before any release tag is created (which itself requires separate
# owner sign-off, SPEC-03 §4).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly full DB battery: 18:00 UTC = 01:00 Asia/Jakarta (UTC+7).
    - cron: "0 18 * * *"
  workflow_dispatch:
    # Manual dispatch — runs the nightly full DB battery on demand
    # (nightly-integration gates on this event or on `schedule` above;
    # ordinary pushes never run it).

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # for commit metadata ldflags

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Print toolchain
        run: |
          go version
          go env GOMOD GOFLAGS

      - name: go mod download
        run: go mod download

      - name: Build (AC-1.1)
        run: make build VERSION=ci COMMIT=$(git rev-parse --short HEAD) BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)

      - name: Verify version metadata
        run: ./bin/gseer version

      - name: Vet (AC-1.2)
        run: go vet ./...

      - name: Test (incl. AC-3.1 import-graph, AC-5.1 no-phantom stub)
        run: go test -race ./...

      - name: Migration audit (AC-M3-15)
        # Surface pin over the full -race ./... run above: makes the
        # force-callable invariant visible as its own CI step.
        run: go test -run TestForceNotCallableFromOtherCommands -count=1 ./internal/cli

  # Windows coverage: the updater durability suite (MoveFileExW flags,
  # rollback, E_UPDATE_DIRSYNC warning, platform-honest permissions via
  # assertPerm) and the Windows portability fixes (embed.FS path.Join,
  # export clean-form FromSlash, db_test ToSlash) can only EXECUTE on a
  # Windows host. The full unit suite also runs here — Windows is a
  # first-class supported platform, not a compile-only target.
  update-windows:
    name: Updater durability + full suite (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: Updater tests (platform-neutral + Windows MoveFileExW coverage)
        run: go test -count=1 ./internal/update/...
      - name: Updater race detector
        run: go test -race -count=1 ./internal/update/...
      - name: Full unit suite on Windows
        run: go test -count=1 ./...
      - name: Vet on Windows
        run: go vet ./...
      - name: Build on Windows
        run: go build ./...

  lint:
    name: Lint (golangci-lint v2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      # golangci-lint-action v9 runs on node24 (required by current
      # GitHub runners); v2.15.0 is the first pinned linter release that
      # builds with Go 1.26 and understands the repo's v2 config.
      # `version: latest` was removed on purpose: the action resolved it
      # to a v1.64.x binary built with Go 1.24, which cannot process a
      # Go 1.26 module (the original post-push CI failure).
      - name: golangci-lint (AC-1.3)
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          args: --timeout 5m

  vuln:
    name: Vulnerability scan (govulncheck, AC-1.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      # Pinned to v1.9.0 (built with Go 1.27.x) for reproducibility;
      # `@latest` had previously resolved to a v1.1.4 binary that could
      # not scan a Go 1.26 module.
      - name: Install govulncheck (pinned v1.9.0)
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: govulncheck (AC-1.4)
        run: govulncheck ./...

  # Release-engineering regression pin (REL-02): .goreleaser.yaml must
  # stay parseable and schema-valid for the exact GoReleaser version
  # that performs releases (pinned v2.20.0 in release.yml).  The
  # validator catches YAML syntax errors (the previous draft used `//`
  # comments, which are not YAML), unknown schema fields, and build
  # matrix mistakes on every push — an invalid release config can no
  # longer merge silently.
  release-config:
    name: Release config (goreleaser check, REL-02)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: goreleaser check (pinned CLI v2.20.0)
        uses: goreleaser/goreleaser-action@v2.9.1
        with:
          distribution: goreleaser
          version: v2.20.0
          args: check
      - name: Snapshot build compiles the full matrix (REL-02)
        # Builds linux/darwin/windows x amd64/arm64 without publishing
        # anything; proves builds.main (./cmd/gseer) and the ldflags
        # version metadata resolve for every configured target.  Runs
        # THROUGH the action (same pinned CLI v2.20.0): the action
        # invokes the CLI inside its own step and does not leave the
        # binary on PATH for a later bare `run:` step.
        uses: goreleaser/goreleaser-action@v2.9.1
        with:
          distribution: goreleaser
          version: v2.20.0
          args: build --snapshot --clean

  # Search ≠ Scan is the most important architectural property of GSEER
  # (the import graph never lets a collector/egress package reach the
  # search or CLI packages). Surfaced as its own job for visibility.
  import-graph:
    name: Search ≠ Scan (AC-3.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: AC-3.1 import-graph test
        run: go test -run TestImportGraphSearchNotScan -count=1 ./internal/cli
      - name: AC-7.x active-observation absence
        run: go test -run TestNoCollectorPackageExists -count=1 ./internal/cli

  # Database integration tests against real PostgreSQL 16 AND 17
  # (matrix). Runs on every push and PR; the unit-only build job above
  # stays fast (no PG container). All seven integration packages run:
  # storage/postgres, collect, search, gql/planner, fixture, cli, export.
  integration-test:
    name: DB integration (PostgreSQL ${{ matrix.pg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}-alpine
        env:
          POSTGRES_USER: gseer
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U gseer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: Integration tests (all seven integration packages)
        env:
          GSEER_TEST_PG_ADMIN: postgres://gseer@127.0.0.1:5433/postgres?sslmode=disable
          GSEER_TEST_REQUIRE: "1"
        run: >
          go test -race -tags integration
          ./internal/storage/postgres/
          ./internal/collect/
          ./internal/search/
          ./internal/gql/planner/
          ./internal/fixture/
          ./internal/cli/
          ./internal/export/
      - name: Privilege audit (AC-M13 — suppression audit survival)
        # Surface pin over the integration run above: the suppression
        # audit invariant gets its own visible CI step.
        env:
          GSEER_TEST_PG_ADMIN: postgres://gseer@127.0.0.1:5433/postgres?sslmode=disable
          GSEER_TEST_REQUIRE: "1"
        run: go test -race -tags integration -run TestSuppressionAuditSurvivesRuleRemoval -count=1 ./internal/storage/postgres/

  # Full battery: nightly schedule (01:00 Asia/Jakarta) and manual
  # dispatch only — ordinary pushes keep the fast integration-test job
  # above and never pay for the full battery on both PG versions.
  nightly-integration:
    name: Nightly DB integration (full battery, PG ${{ matrix.pg }})
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}-alpine
        env:
          POSTGRES_USER: gseer
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U gseer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: Full integration battery with race detector and coverage
        env:
          GSEER_TEST_PG_ADMIN: postgres://gseer@127.0.0.1:5433/postgres?sslmode=disable
          GSEER_TEST_REQUIRE: "1"
        run: >
          go test -race -tags integration -cover
          ./internal/storage/postgres/
          ./internal/collect/
          ./internal/search/
          ./internal/gql/planner/
          ./internal/fixture/
          ./internal/cli/
          ./internal/export/
