# GSEER CI (v0.1.0).
#
# AC-1.1: go build ./... under both 1.26.x and 1.27.x.
# AC-1.2: go vet ./... clean.
# AC-1.3: golangci-lint (v2 config) run clean.
# AC-1.4: govulncheck ./... clean.
# AC-3.1: import-graph test green (no collector/egress deps).
# AC-5.1: no-phantom-commands test — every help-listed command is
#   registered and runnable (completed in M11; kept as a CI pin).
#
# The release gate requires all of the above green on both Go majors
# before any release tag is created (which itself requires separate
# owner sign-off, SPEC-03 §4).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly full DB battery: 18:00 UTC = 01:00 Asia/Jakarta (UTC+7).
    - cron: "0 18 * * *"
  workflow_dispatch:
    # Manual dispatch — the only way to run the nightly full DB battery
    # on demand (nightly-integration's job condition gates on this
    # event or on `schedule` above; ordinary pushes never run it).

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # for commit metadata ldflags

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Print toolchain
        run: |
          go version
          go env GOMOD GOFLAGS

      - name: go mod download
        run: go mod download

      - name: Build (AC-1.1)
        run: make build VERSION=ci COMMIT=$(git rev-parse --short HEAD) BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)

      - name: Verify version metadata
        run: ./bin/gseer version

      - name: Vet (AC-1.2)
        run: go vet ./...

      - name: Test (incl. AC-3.1 import-graph, AC-5.1 no-phantom stub)
        run: go test -race ./...

  # Windows durability coverage for the updater: the replacement
  # primitive (MoveFileExW with MOVEFILE_REPLACE_EXISTING |
  # MOVEFILE_WRITE_THROUGH — os.Rename passes no write-through flag on
  # Windows), the flag assertion, backup/rollback and the
  # E_UPDATE_DIRSYNC warning contract can only execute on a Windows
  # host.  The full platform-neutral updater suite runs here too.
  update-windows:
    name: Updater durability (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: Updater tests (platform-neutral + Windows MoveFileExW coverage)
        run: go test -count=1 ./internal/update/...
      - name: Updater race detector
        run: go test -race -count=1 ./internal/update/...
      - name: Full unit suite on Windows
        run: go test -count=1 ./...
      - name: Vet on Windows
        run: go vet ./...
      - name: Build on Windows
        run: go build ./...

  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      # golangci-lint-action v9 runs on node24 (required by current
      # GitHub runners); v2.15.0 is the first pinned linter release that
      # builds with Go 1.26 and understands the repo's v2 config.
      # `version: latest` was removed on purpose: the action resolved it
      # to a v1.64.x binary built with Go 1.24, which cannot process a
      # Go 1.26 module (the original post-push CI failure).
      - name: golangci-lint (AC-1.3)
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          args: --timeout 5m

  vuln:
    name: Vulnerability scan (govulncheck, AC-1.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck (AC-1.4)
        run: govulncheck ./...

  # The import-graph job is also run as a Go test above, but we surface
  # it as its own job for visibility (the Search ≠ Scan invariant is the
  # most important architectural property of GSEER).
  import-graph:
    name: Search ≠ Scan (AC-3.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: AC-3.1 import-graph test
        run: go test -run TestImportGraphSearchNotScan ./internal/cli
      - name: AC-7.x active-observation absence
        run: go test -run TestNoCollectorPackageExists ./internal/cli

  # Database integration tests against a real PostgreSQL service
  # (migrations, bounded advisory lock, failure-injection rollback,
  # force recovery, pool lifecycle, collection/suppression/facets/
  # export flows).  Runs on every push and PR; the unit-only build job
  # above stays fast (no PG container).
  integration-test:
    name: DB integration (PostgreSQL 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gseer
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U gseer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: Integration tests (AC-M3-1..18)
        env:
          GSEER_TEST_PG_ADMIN: postgres://gseer@127.0.0.1:5433/postgres?sslmode=disable
          GSEER_TEST_REQUIRE: "1"
        run: go test -race -tags integration ./internal/storage/postgres/

  # Full battery: nightly schedule (01:00 Asia/Jakarta) and manual
  # dispatch only — ordinary pushes keep the fast integration-test job
  # above and never pay for the full battery.
  nightly-integration:
    name: Nightly DB integration (full battery)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gseer
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U gseer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: Full integration battery with race detector and coverage
        env:
          GSEER_TEST_PG_ADMIN: postgres://gseer@127.0.0.1:5433/postgres?sslmode=disable
          GSEER_TEST_REQUIRE: "1"
        run: go test -race -tags integration -cover ./internal/storage/postgres/
