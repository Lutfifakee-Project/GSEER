# Valid self-hosted config for M2 tests.
profile: self-hosted

server:
  listen: "127.0.0.1:8443"
  token: "test-token-do-not-use-in-prod"

database:
  host: "127.0.0.1"
  port: 5432
  user: "gseer"
  password: "test-password"
  name: "gseer"
  sslmode: "disable"

policy:
  evaluation_fixtures: false

log:
  level: "info"
  format: "text"

sources:
  - name: "ct-test"
    type: "ct"
    endpoint: "https://ct.example.com"
    enabled: false

defaults:
  search_mode: "service"
